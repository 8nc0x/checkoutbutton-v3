<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening PhonePe...</title>
  <style>
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      margin-top: 20px;
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="font-size: 18px; margin: 0 0 8px;">Opening PhonePe</h2>
  <p style="color: #64748b; font-size: 13px; margin: 0;">If PhonePe does not open automatically, tap below:</p>
  <a id="manualBtn" class="btn" href="#">Open PhonePe</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const vpa = params.get('upi') || 'bharatpe2d0m0l0i3x28941@unitype';
    const amountVal = parseFloat(params.get('am')) || 1.48;
    const amountPaise = Math.floor(amountVal * 100);
    const name = params.get('pn') || 'Websynd Ltd';
    const note = params.get('tn') || ('NIYO' + Date.now());

    const newPhonePePayload = {
      contact: {
        "cb-Name": "",
        nickName: name,
        vpa: vpa,
        type: "VPA"
      },
      p2pPaymentCheckoutParams: {
        note: note,
        isByDefaultKnownContact: true,
        enableSpeechToText: false,
        allowAmountEdit: false,
        showQrCodeOption: false,
        disableViewHistory: true,
        shouldShowUnsavedContactBanner: false,
        isRecurring: false,
        checkoutType: "DEFAULT",
        transactionContext: "p2p",
        initialAmount: amountPaise,
        disableNotesEdit: true,
        showKeyboard: false,
        currency: "INR",
        shouldShowMaskedNumber: true
      }
    };

    const jsonStr = JSON.stringify(newPhonePePayload);
    const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
    const deepLink = `phonepe://native?data=${base64}&id=p2ppayment`;

    document.getElementById('manualBtn').href = deepLink;
    window.location.replace(deepLink);
  </script>
</body>
</html>
